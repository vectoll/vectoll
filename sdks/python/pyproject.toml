[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vectoll"
version = "1.0.0"
description = "Official Python Agent & MCP SDK for Vectoll HTTP 402 multi-rail settlement and Spend Mandates"
readme = "../../README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "cryptography>=41.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
