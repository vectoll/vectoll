version: "1.0"

service:
  name: "vectoll-global-cloud-gateway"
  description: "Global AI market intelligence, multi-region inference & escrow-backed enterprise capacity API"
  origin: "http://127.0.0.1:8080"
  listen: ":4020"
  discovery_path: "/.well-known/vectoll.json"
  enable_mcp: true

settlement:
  facilitator_url: "http://127.0.0.1:4021"
  default_currency: "USD"
  default_decimals: 6
  accepted_rails:
    - "x402_usdc"
    - "stripe"
    - "sepa_instant"
    - "ach_fednow"
    - "pix_upi"
    - "mpesa"
    - "momo"
    - "airtel_money"
    - "voucher"

routes:
  - path: "/api/v1/intel/global-markets"
    method: "GET"
    price: 5000 # $0.005 USD (5,000 micro-USD)
    currency: "USD"
    decimals: 6
    human_passthrough: true
    mcp_tool: "query_global_markets"
    mcp_description: "Fetch real-time global macro, FX, and compute spot intelligence ($0.005 USD)"

  - path: "/api/v1/compute/inference"
    method: "POST"
    price: 15000 # $0.015 USD (15,000 micro-USD)
    currency: "USD"
    decimals: 6
    human_passthrough: false
    mcp_tool: "run_verified_inference"
    mcp_description: "Execute metered structured synthesis across global edge nodes ($0.015 USD)"

  - path: "/api/v1/enterprise/reserve"
    method: "POST"
    price: 250000000 # $250.00 USD (250,000,000 micro-USD)
    currency: "USD"
    decimals: 6
    settlement_mode: "escrow"
    require_mandate: true
    hitl_threshold: 200000000 # Triggers human guardrail approval >= $200.00 USD
    human_passthrough: false
    mcp_tool: "reserve_enterprise_cluster"
    mcp_description: "Reserve dedicated multi-region cluster capacity with mandate-backed escrow ($250.00 USD)"
