      <polygon points="237,9 325,9 325,31 261,31 261,85 325,85 325,107 237,107"/>
      <polygon points="345,9 441,9 441,31 405,31 405,107 381,107 381,31 345,31"/>
      <path d="M461,9 H551 V107 H461 Z M485,31 V85 H527 V31 Z" fill-rule="evenodd"/>
      <polygon points="571,9 595,9 595,85 647,85 647,107 571,107"/>
      <polygon points="667,9 691,9 691,85 743,85 743,107 667,107"/>
