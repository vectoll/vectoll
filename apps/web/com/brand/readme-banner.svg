      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="360" rx="18" fill="url(#bgGrad)"/>
  <rect width="1280" height="360" rx="18" fill="url(#grid)"/>
  <rect width="1280" height="360" rx="18" fill="url(#glow)"/>
  <rect x="1" y="1" width="1278" height="358" rx="17" stroke="#1E293B" stroke-width="2"/>

