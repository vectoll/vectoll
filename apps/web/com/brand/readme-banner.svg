<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" fill="none" role="img" aria-label="Vectoll — Global Metering, Verification & Multi-Rail Settlement for the Agentic Web">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1280" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#070A10"/>
      <stop offset="55%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#09131F"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1E293B" stroke-width="0.7" opacity="0.55"/>
