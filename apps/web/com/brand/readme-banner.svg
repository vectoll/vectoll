      <polygon points="122,0 208,0 208,22 146,22 146,38 196,38 196,60 146,60 146,76 208,76 208,98 122,98"/>
      <polygon points="228,0 316,0 316,22 252,22 252,76 316,76 316,98 228,98"/>
      <polygon points="336,0 432,0 432,22 396,22 396,98 372,98 372,22 336,22"/>
