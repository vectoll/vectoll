name: Vectoll CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typescript-monorepo:
    name: TypeScript Packages & Facilitator (Node 24)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

  go-gate:
    name: Go vectoll-gate Proxy & Crypto Vectors
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/gate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '>=1.23'
      - run: go test -race -v ./...
      - run: go build -v ./cmd/vectoll-gate

  python-sdk:
    name: Python SDK & Crypto Vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e "./sdks/python[dev]"
      - run: pytest -v sdks/python
